name: test
on:
  push:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true
jobs:
  primary:
    runs-on: ubuntu-latest
    env:
      RESOURCE_NAME: resource-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          resource-name: ${{ env.RESOURCE_NAME }}
      - name: "Create resource (simulated)"
        run: |
          echo "creating $RESOURCE_NAME"
          sleep 10
          echo "created $RESOURCE_NAME"
